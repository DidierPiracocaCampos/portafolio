    <!-- Aplica el tema antes del primer pintado para evitar el flash oscuro→claro.
         Debe coincidir con ThemeService (clave 'theme', valores 'gold' | 'goldlight'). -->
    <script>
      (function () {
        var theme = 'gold';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'gold' || stored === 'goldlight') {
            theme = stored;
          } else if (window.matchMedia && !matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'goldlight';
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'goldlight' ? '#f7f5f1' : '#0b0b0d');
      })();
    </script>
