<div class="section-title">
  <div class="section-title__rules" aria-hidden="true">
    <span class="section-title__rule"></span>
    <span class="section-title__rule"></span>
  </div>
  @if (level() === 'h3') {
    <h3 [attr.id]="headingId() ?? null" class="section-title__heading">{{ title() }}</h3>
  } @else {
    <h2 [attr.id]="headingId() ?? null" class="section-title__heading">{{ title() }}</h2>
  }
  <div class="section-title__rules" aria-hidden="true">
    <span class="section-title__rule"></span>
    <span class="section-title__rule"></span>
  </div>
</div>
