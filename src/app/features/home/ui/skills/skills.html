<section class="skills" aria-labelledby="skills-title">
  <app-section-title [title]="'skills.heading' | translate" headingId="skills-title" />

  <div class="skills__inner">
    <div class="skills__grid">
      @for (group of groups; track group.id) {
        <article
          class="skills__group"
          [attr.aria-labelledby]="'skills-group-' + group.id + '-title'"
        >
          <h3 [id]="'skills-group-' + group.id + '-title'">{{ group.headingKey | translate }}</h3>

          <ul class="skills__items">
            @for (item of group.items; track item.id) {
              <li>
                <span class="skills__item">
                  @for (labelKey of item.labelKeys; track labelKey; let last = $last) {
                    <span class="skills__label">
                      <svg
                        class="skills__icon"
                        viewBox="0 0 16 16"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path
                          d="M2 2h12v12H2zM5 5h6M5 8h6M5 11h4"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.5"
                        />
                      </svg>
                      <span>{{ labelKey | translate }}</span>
                    </span>
                    @if (!last && item.separator) {
                      <span class="skills__separator" aria-hidden="true">{{ item.separator }}</span>
                    }
                  }
                </span>
              </li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
