<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 · Didier Piracoca</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark light;
        --bg: oklch(9% 0.004 286);
        --text: oklch(96% 0.01 85);
        --accent: oklch(75% 0.16 85);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: oklch(97.5% 0.006 85);
          --text: oklch(27% 0.03 270);
          --accent: oklch(50% 0.12 65);
        }
      }
      body {
        display: grid;
        place-content: center;
        min-height: 100dvh;
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font-family: 'Cascadia Code', ui-monospace, Consolas, Menlo, monospace;
        line-height: 1.6;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
      }
      nav {
        margin-top: 24px;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span aria-hidden="true">$ </span>404: page not found</h1>
      <p lang="es">Esta página no existe.</p>
      <nav>
        <a href="/es" lang="es">Ir al portafolio</a> · <a href="/en">Go to portfolio</a>
      </nav>
    </main>
  </body>
</html>
