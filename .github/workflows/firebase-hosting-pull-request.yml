# Adapted from DevHelper upgrades (checkout@v5, pnpm@v6/10, setup-node@v5 + cache)
# PR preview usa CLI directo sin fallback FIREBASE_TOKEN (solo merge lo tiene)
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Inject Firebase Secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: |
          sed -i "s|FIREBASE_API_KEY|$FIREBASE_API_KEY|g" src/environments/environment.ts
          sed -i "s|FIREBASE_AUTH_DOMAIN|$FIREBASE_AUTH_DOMAIN|g" src/environments/environment.ts
          sed -i "s|FIREBASE_DATABASE_URL|$FIREBASE_DATABASE_URL|g" src/environments/environment.ts
          sed -i "s|FIREBASE_PROJECT_ID|$FIREBASE_PROJECT_ID|g" src/environments/environment.ts
          sed -i "s|FIREBASE_STORAGE_BUCKET|$FIREBASE_STORAGE_BUCKET|g" src/environments/environment.ts
          sed -i "s|FIREBASE_MESSAGING_SENDER_ID|$FIREBASE_MESSAGING_SENDER_ID|g" src/environments/environment.ts
          sed -i "s|FIREBASE_APP_ID|$FIREBASE_APP_ID|g" src/environments/environment.ts
          sed -i "s|FIREBASE_MEASUREMENT_ID|$FIREBASE_MEASUREMENT_ID|g" src/environments/environment.ts

      - name: Install & Build
        run: pnpm install && pnpm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting (preview)
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTAFOLIO_71784 }}' > $HOME/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-sa.json
          echo "Deploying preview with Service Account..."
          firebase hosting:channel:deploy pr-${{ github.event.number }} --expires 7d --project portafolio-71784 --non-interactive
